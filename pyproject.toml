[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc2video"
version = "0.1.0"
description = "Turn a Markdown document into a narrated lesson video with slides, voice-over and subtitles."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ayoub Amrani" }]
dependencies = ["pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
doc2video = "doc2video.__main__:main"

[tool.setuptools]
packages = ["doc2video"]
